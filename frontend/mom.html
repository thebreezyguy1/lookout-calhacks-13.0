<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookout · Check-in</title>
<link rel="stylesheet" href="styles.css">
<script>if (new URLSearchParams(location.search).has("compact")) document.documentElement.classList.add("compact");</script>
<style>
  /* Designed for an older adult: very large type, high contrast, one question at a time. */
  body { font-size: 24px; line-height: 1.5; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 48px; display: grid; gap: 22px; }
  .brand { font-size: 22px; font-weight: 700; color: var(--muted); }
  .brand span { color: var(--accent); }
  h1 { font-size: 40px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; }
  .card { background: var(--surface); border: 2px solid var(--border); border-radius: 16px; padding: 28px; }
  .calm { text-align: center; padding: 48px 28px; display: grid; gap: 16px; }
  .calm .mark { width: 96px; height: 96px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; margin: 0 auto; font-size: 56px; font-weight: 700; }

  .events { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .events li { background: var(--surface-2); border-radius: 12px; padding: 12px 18px; }
  .events .what { font-weight: 700; font-size: 26px; }
  .events .when { color: var(--muted); font-size: 19px; }

  .chat { display: grid; gap: 14px; }
  .msg { max-width: 88%; padding: 16px 20px; border-radius: 18px; font-size: 26px; line-height: 1.45; }
  .msg.lookout { background: var(--surface); border: 2px solid var(--border); justify-self: start; border-bottom-left-radius: 6px; }
  .msg.parent { background: var(--accent); color: var(--accent-ink); justify-self: end; border-bottom-right-radius: 6px; }
  .msg.latest { border-color: var(--accent); }

  .answer { display: grid; gap: 14px; }
  .choices { display: grid; gap: 12px; }
  .choices button, .send, .speak {
    min-height: 72px; padding: 14px 22px; border-radius: 14px; font-size: 26px; font-weight: 700;
    cursor: pointer; border: 3px solid var(--accent); background: var(--surface); color: var(--accent); text-align: left;
  }
  .choices button:hover { background: var(--surface-2); }
  .own { display: flex; gap: 10px; flex-wrap: wrap; }
  .own input { flex: 1 1 260px; min-width: 0; min-height: 72px; font-size: 24px; padding: 12px 16px; border-radius: 14px; border: 3px solid var(--border); background: var(--surface); }
  .send { background: var(--accent); color: var(--accent-ink); text-align: center; }
  .speak { border-color: var(--border); color: var(--text); font-size: 20px; min-height: 56px; justify-self: start; }
  button:focus-visible, input:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  button:disabled, input:disabled { opacity: .5; cursor: progress; }
  .finished { background: var(--ok-bg); color: var(--ok); border-radius: 14px; padding: 16px 20px; font-size: 22px; }
  .safety { font-size: 20px; color: var(--muted); }
  .error { color: var(--hold); font-size: 20px; }
  /* Compact: inside the demo phone. Still large for a phone, smaller than the tablet view. */
  .compact body { font-size: 19px; }
  .compact .wrap { padding: 14px 12px 24px; gap: 14px; }
  .compact .brand { display: none; }
  .compact h1 { font-size: 28px; }
  .compact .msg { font-size: 19px; padding: 12px 14px; }
  .compact .events .what { font-size: 19px; }
  .compact .events .when { font-size: 15px; }
  .compact .choices button, .compact .send { font-size: 19px; min-height: 54px; padding: 10px 14px; }
  .compact .speak { font-size: 16px; min-height: 44px; }
  .compact .own input { font-size: 18px; min-height: 54px; flex-basis: 160px; }
  .compact .safety, .compact .finished, .compact .error { font-size: 15px; }
  .compact .calm { padding: 28px 16px; }
  .compact .calm .mark { width: 64px; height: 64px; font-size: 36px; }
  @media (prefers-reduced-motion: no-preference) {
    .msg { animation: rise .25s ease-out; }
    @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Look<span>out</span></div>

  <section id="allWell" class="card calm" hidden>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>All is well</h1>
    <p>Nothing needs your attention right now.</p>
  </section>

  <section id="talk" hidden>
    <div style="display:grid;gap:18px">
      <ul class="events" id="events" aria-label="The payments we're asking about"></ul>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="answer" id="answer">
        <div class="choices" id="choices"></div>
        <form class="own" id="own">
          <input id="ownText" autocomplete="off" placeholder="Or type your answer here" aria-label="Type your answer">
          <button class="send" type="submit">Send</button>
        </form>
        <button class="speak" id="speak" type="button">Read this to me</button>
      </div>
      <div class="finished" id="finished" hidden>Thank you. You can close this screen now.</div>
      <div class="error" id="error" hidden></div>
    </div>
  </section>

  <p class="safety">Lookout will never ask for your passwords, codes or account numbers, and it never moves your money.</p>
</div>
<script src="mom.js"></script>
</body>
</html>
