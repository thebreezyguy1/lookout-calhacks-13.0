<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookout · Demo stage</title>
<link rel="stylesheet" href="styles.css">
<style>
  .stage { max-width: 1240px; margin: 0 auto; padding: 18px 16px 40px; display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .brand { font-weight: 700; font-size: 20px; }
  .brand span { color: var(--accent); }
  .sim-note { font-size: 13px; color: var(--check); background: var(--check-bg); padding: 4px 10px; border-radius: 999px; }
  header .spacer { flex: 1; }
  a.btn, button.btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; font-size: 14px;
    border: 1px solid var(--border); background: var(--surface); text-decoration: none; cursor: pointer; color: var(--text);
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.scam { background: var(--hold); color: #fff; border-color: var(--hold); }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 400px minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); justify-items: stretch; } .phone-wrap { justify-self: center; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
  .panel h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .panel.scammer { border-color: var(--hold); border-style: dashed; }
  .panel select, .panel input, .panel textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; }
  .panel textarea { min-height: 64px; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .small { font-size: 13px; }
  .muted { color: var(--muted); }
  .next { font-size: 14px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
  .next b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
  .actions { display: grid; gap: 6px; }
  .actions .btn { justify-content: flex-start; text-align: left; }
  .heard { font-size: 13px; border-left: 3px solid var(--border); padding-left: 10px; display: grid; gap: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--hold-bg); color: var(--hold); font-weight: 600; }
  .error { color: var(--hold); font-size: 13px; }

  /* Mom's phone */
  .phone-wrap { display: grid; gap: 8px; justify-items: center; }
  .phone { width: 380px; max-width: 100%; height: 780px; background: #111; border-radius: 48px; padding: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .screen { position: relative; height: 100%; border-radius: 38px; overflow: hidden; background: #f7f7f7; color: #111; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .status { display: flex; justify-content: space-between; padding: 14px 26px 6px; font-size: 14px; font-weight: 600; }
  .view { overflow-y: auto; display: grid; align-content: start; position: relative; }
  .thread-head { text-align: center; padding: 8px 12px 10px; border-bottom: 1px solid #e3e3e3; background: #fafafa; }
  .thread-head .who { font-weight: 600; font-size: 15px; }
  .thread-head .sub { font-size: 12px; color: #777; }
  .bubbles { display: grid; gap: 6px; padding: 12px; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 18px; background: #e5e5ea; font-size: 16px; line-height: 1.35; justify-self: start; }
  .bubble time { display: block; font-size: 11px; color: #888; margin-top: 2px; }
  .empty-phone { padding: 40px 24px; text-align: center; color: #888; font-size: 15px; }
  .callview { background: linear-gradient(#2c3e50, #1a1a1a); color: #fff; position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0,1fr) auto; padding: 96px 18px 24px; gap: 12px; text-align: center; }
  .callview .who { font-size: 20px; font-weight: 500; }
  .callview .timer { font-size: 15px; opacity: .75; }
  .captions { overflow-y: auto; text-align: left; display: grid; gap: 8px; align-content: end; }
  .captions .cap { background: rgba(255,255,255,.12); border-radius: 12px; padding: 8px 12px; font-size: 16px; line-height: 1.35; }
  .captions .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; }
  .endcall { justify-self: center; width: 64px; height: 64px; border-radius: 50%; background: #e53935; border: 0; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #ddd; background: #fafafa; }
  .tabs button { padding: 10px 0 18px; border: 0; background: none; font-size: 13px; color: #888; cursor: pointer; }
  .tabs button.on { color: #007aff; font-weight: 600; }

  .banner { position: absolute; top: 44px; left: 10px; right: 10px; z-index: 5; background: rgba(255,255,255,.97); color: #111; border-radius: 18px; padding: 12px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); cursor: pointer; border: 0; text-align: left; font: inherit; display: grid; gap: 2px; }
  .banner .app { font-size: 12px; font-weight: 700; color: #2f5d50; text-transform: uppercase; letter-spacing: .05em; }
  .banner .t { font-size: 15px; font-weight: 600; }
  .banner .s { font-size: 14px; color: #444; }
  .sheet { position: absolute; inset: 36px 0 0; z-index: 6; background: var(--bg); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.2); display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
  .sheet .bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .sheet .bar b { color: var(--accent); }
  .sheet iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
  .pill { position: absolute; top: 44px; right: 14px; z-index: 5; background: #2f5d50; color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) {
    .banner:not([hidden]) { animation: drop .35s ease-out; }
    @keyframes drop { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  }

  /* Lookout panel */
  .tierbig { font-size: 20px; font-weight: 700; padding: 8px 12px; border-radius: 10px; width: fit-content; }
  .tierbig.none, .tierbig.log { background: var(--log-bg); color: var(--log); }
  .tierbig.check_in { background: var(--check-bg); color: var(--check); }
  .tierbig.alert { background: var(--alert-bg); color: var(--alert); }
  .tierbig.recommend_hold { background: var(--hold-bg); color: var(--hold); }
  .sigs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
  .sigs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .sigs .w { font-family: var(--mono); color: var(--muted); font-size: 12px; }
  .sigs li.link { background: var(--hold-bg); color: var(--hold); border-radius: 8px; padding: 6px 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="brand">Look<span>out</span> · demo stage</div>
    <span class="sim-note">Simulated phone. Texts, calls and purchases here are labeled as injected.</span>
    <div class="spacer"></div>
    <a class="btn" href="index.html" target="_blank" rel="noopener">Family dashboard ↗</a>
    <button class="btn" id="resetBtn" type="button">Reset demo</button>
  </header>

  <div class="cols">
    <section class="panel scammer" aria-label="Scammer console">
      <h2>Scammer console</h2>
      <select id="script" aria-label="Scam script"></select>
      <div class="next" id="next"></div>
      <div class="row">
        <button class="btn scam" id="sendNext" type="button">Send next line</button>
        <label class="small row" style="gap:6px"><input type="checkbox" id="useLlm" checked style="width:auto"> Claude reads messages</label>
      </div>

      <h2 style="margin-top:6px">Or write your own</h2>
      <div class="row">
        <label class="small row" style="gap:4px"><input type="radio" name="ch" value="sms" checked style="width:auto"> Text</label>
        <label class="small row" style="gap:4px"><input type="radio" name="ch" value="call" style="width:auto"> Call</label>
      </div>
      <input id="sender" placeholder="From (name or number)" value="+1 (305) 555-0123" aria-label="Sender">
      <textarea id="text" placeholder="Type what the scammer says…" aria-label="Message"></textarea>
      <button class="btn scam" id="sendOwn" type="button">Send to Mom's phone</button>

      <h2 style="margin-top:6px">Mom's bank activity (simulated)</h2>
      <div class="actions" id="actions"></div>
      <div class="heard" id="heard" hidden></div>
      <div class="error" id="error" hidden></div>
    </section>

    <div class="phone-wrap">
      <div class="phone" aria-label="Mom's phone">
        <div class="screen">
          <div class="status"><span id="clock">9:41</span><span>●●● 5G ▮</span></div>
          <div class="view" id="view"></div>
          <nav class="tabs">
            <button type="button" id="tabMsgs" class="on">Messages</button>
            <button type="button" id="tabCall">Phone</button>
          </nav>
          <button class="banner" id="banner" type="button" hidden>
            <span class="app">Lookout · now</span>
            <span class="t">This might be a scam</span>
            <span class="s">Can we talk for a moment before you do anything?</span>
          </button>
          <button class="pill" id="pill" type="button" hidden>Lookout</button>
          <div class="sheet" id="sheet" hidden>
            <div class="bar"><b>Lookout</b><button class="btn" id="minimize" type="button">Minimize</button></div>
            <iframe id="momFrame" title="Lookout check-in" src="about:blank"></iframe>
          </div>
        </div>
      </div>
      <div class="small muted">Dolores's phone</div>
    </div>

    <section class="panel" aria-label="What Lookout sees">
      <h2>What Lookout sees</h2>
      <div class="tierbig none" id="tier">Watching</div>
      <div class="small muted" id="tierMeta">No concerns yet.</div>
      <ul class="sigs" id="sigs"></ul>
      <a class="btn" href="index.html" target="_blank" rel="noopener" style="justify-self:start">Open family dashboard ↗</a>
    </section>
  </div>
</div>
<script src="phone.js"></script>
</body>
</html>
